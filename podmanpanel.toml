[server]
# Bind to 0.0.0.0 to expose on the local network, or 127.0.0.1 for localhost only
host = "0.0.0.0"
port = 8080

[commands]
# Custom quick-access buttons shown in the web UI.
# Format: "Button Label" = "shell command"
# "Restart Nginx" = "systemctl restart nginx"
# "Clear journal" = "journalctl --vacuum-time=2d"
